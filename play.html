function update(dt){if(!opened){let throttle=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);car.v+=throttle*13*dt;car.v*=Math.pow(keys[' ']?.07:.48,dt);car.v=Math.max(-6,Math.min(12,car.v));let steer=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);car.a+=steer*2.2*dt*Math.min(1,Math.abs(car.v)/2)*(car.v<0?-1:1);let nx=car.x+Math.sin(car.a)*car.v*dt,nz=car.z+Math.cos(car.a)*car.v*dt;car.x=Math.max(-29,Math.min(29,nx));car.z=Math.max(-23,Math.min(34,nz));travel+=Math.abs(car.v)*dt;}

function showPanel(html){returnFocus=document.activeElement;keys={};car.v=0;opened=true;$('#panel-content').innerHTML=html;$('#veil').classList.add('open');$('.panel').focus()}

function visit(q){visited.add(q.id);$('#count').textContent=visited.size;$('#dots').innerHTML=zones.map(z=>`<i class="${visited.has(z.id)?'done':''}"></i>`).join('');showPanel(`<span class="label">${q.en}</span><h2 id="panel-title">${q.title}</h2><p>${q.body}</p><div class="tags">${q.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>${q.id==='contact'?'<a class="primary" href="tel:18625554386">拨个电话 ↗</a><button class="secondary" id="copy">复制号码</button><a class="secondary" href="chen-yijie.vcf" download="陈奕洁.vcf">保存联系人 ↓</a>':'<button class="primary" id="keep">继续兜风 ↗</button>'}<p class="footnote">已探索 ${visited.size} / 6 个地点 · ESC 关闭</p>`);if($('#copy'))$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText('18625554386');toast('号码已复制')}catch(e){toast('电话号码：18625554386')}};if($('#keep'))$('#keep').onclick=closePanel;}
function map(){showPanel(`<span class="label">THE WORLD OF CHEN YIJIE</span><h2 id="panel-title">下一站，去哪儿？</h2><p>开车慢慢逛，或直接点开一个地点认识我。<br>电脑用 WASD / 方向键，手机用左下角按钮。<br>靠近地点后，按 E 或点击提示即可阅读。</p><div class="destinations">${zones.map((q,i)=>`<button class="destination" data-go="${i}"><strong>${visited.has(q.id)?'✓ ':''}${q.name.split(' · ')[1]}</strong><small>0${i+1} / ${q.en}</small></button>`).join('')}</div><p class="footnote">不想开车？这里也能读完所有介绍。</p>`);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{let q=zones[+b.dataset.go];car.x=q.x;car.z=q.z+3;car.a=Math.PI;visit(q)})}
function reset(){car={x:0,z:5,a:Math.PI,v:0};keys={};toast('已回到起点。继续探索吧！')}

addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(opened){if(k==='escape')closePanel();if(k==='tab'){let a=[...$('.panel').querySelectorAll('button,a[href]')],first=a[0],end=a[a.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===$('.panel'))){e.preventDefault();end.focus()}else if(!e.shiftKey&&document.activeElement===end){e.preventDefault();first.focus()}}return;}if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();keys[k]=true;if(e.repeat)return;if(k==='e'&&near)visit(near);if(k==='m')map();if(k==='r')reset();});addEventListener('keyup',e=>delete keys[e.key.toLowerCase()]);addEventListener('blur',()=>{keys={};car.v=0});document.addEventListener('visibilitychange',()=>{if(document.hidden){keys={};car.v=0}});
document.querySelectorAll('[data-key]').forEach(b=>{b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[b.dataset.key]=true;b.classList.add('active')};for(let event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>{delete keys[b.dataset.key];b.classList.remove('active')})});
$('#dots').innerHTML=zones.map(()=>'<i></i>').join('');requestAnimationFrame(frame);
